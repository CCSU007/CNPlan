# Automatically regenerate flight/train prices (offline, RMB) and push them so
# GitHub Pages serves fresh data — no server needed. Runs daily + on demand.
name: Refresh flight prices

on:
  schedule:
    # daily 15:00 China time (07:00 UTC) — afternoon
    - cron: '0 7 * * *'
  # Manual trigger: repo → Actions → "Refresh flight prices" → Run workflow
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate prices (offline, RMB)
        run: python docs/flight_ticket/refresh_prices.py

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/prices.csv docs/prices.json docs/js/prices_data.js
          git diff --cached --quiet || git commit -m "chore: refresh flight prices"
          git push
