<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>China Explorer · Cities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <section class="hero">
    <div class="container">
      <nav>
        <div class="nav-links-wrap">
          <div class="nav-links">
            <a href="../index.html" class="nav-link">Home</a>
            <a href="planner.html" class="nav-link">Planner</a>
            <a href="map.html" class="nav-link">Map</a>
            <a href="cities.html" class="nav-link active">Cities</a>
            <a href="budget.html" class="nav-link">Budget</a>
            <a href="packing.html" class="nav-link">Packing</a>
            <a href="prices.html" class="nav-link">Prices</a>
            <a href="journal.html" class="nav-link">Journal</a>
            <a href="info.html" class="nav-link">Info</a>
            <a href="thailand.html" class="nav-link">Thailand</a>
          </div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌓</button>
      </nav>
      <div class="hero-grid" style="justify-content:center;">
        <div>
          <p class="eyebrow">Cities</p>
          <h1>What to Do in Each City</h1>
          <p>Discover the top activities, weather, and local flavors at every stop along the route.</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="city-grid" class="city-grid"></div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>China Explorer &middot; A Journey Through China &middot; CC &amp; Joseph</p>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/data.js"></script>
  <script>
    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('city-grid');
      if (!grid) return;

      grid.innerHTML = TRIP.cities.filter(c => c.id !== 'thailand-leg').map(city => {
        const tagsHtml = city.tags.map(t => {
          const label = typeof t === 'string' ? t : t.label;
          const cls = typeof t === 'string' ? '' : t.cls || '';
          return `<span class="tag ${cls}">${label}</span>`;
        }).join('');

        return `
          <div class="city-card">
            <div class="img-wrap" style="background-image:url('${city.image}');background-size:cover;background-position:center;"></div>
            <div class="body">
              <h3>${city.name}</h3>
              <div class="dates">${city.startDate} – ${city.endDate} · ${city.nights} nights</div>
              <div class="tags">${tagsHtml}</div>
              <div style="font-size:.82rem;color:#94a3b8;margin-bottom:.4rem">${city.weather.icon} ${city.weather.temp} · ${city.weather.season}</div>
              <ul>
                ${city.activities.slice(0, 4).map(a => `<li>${a}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
      }).join('');
    });
  </script>
</body>
</html>
